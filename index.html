<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Client → Server Flow</title>
<style>
  :root{
    --bg:#0b0f14;
    --txt:#e6eef8;
    --muted:#94a3b8;
    --ok:#00d27a;
    --bad:#ff4d4f;
    --node-border:#1f2a37;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background: radial-gradient(1200px 800px at 10% 10%, #111826 0%, var(--bg) 60%) no-repeat fixed;
    color:var(--txt);
    font-family: ui-sans-serif, -apple-system, Segoe UI, Roboto, Inter, system-ui, Arial, sans-serif;
    overflow:hidden;
  }

  .bar{
    position:fixed; inset:0 0 auto 0; height:64px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; backdrop-filter: blur(8px);
    background: linear-gradient(180deg, rgba(15,22,32,0.9) 0%, rgba(15,22,32,0.35) 100%);
    border-bottom:1px solid rgba(148,163,184,0.15);
    z-index:10;
  }
  .target{
    font-weight:600; padding:8px 12px; border-radius:10px;
    background:rgba(55,179,255,.1); color:#d7efff; border:1px solid rgba(55,179,255,.25);
  }
  .status{ display:flex; align-items:center; gap:10px; font-weight:600; color:var(--muted); }
  .pill{ width:12px; height:12px; border-radius:999px; background:var(--ok); transition:.2s }
  .status-text{ min-width:120px; text-align:right }

  #stage{
    position:absolute; inset:64px 0 0 0;
    width:100vw; height:calc(100vh - 64px);
    display:block;
  }

  .node{
    position:fixed; top:50%; transform:translateY(-50%);
    width:220px; padding:16px;
    background: linear-gradient(180deg, rgba(18,26,36,0.95), rgba(18,26,36,0.7));
    border:1px solid var(--node-border);
    border-radius:16px; backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
    z-index:5;
  }
  .node h3{ margin:0 0 6px 0; font-size:16px }
  .node p{ margin:0; color:var(--muted); font-size:13px }
  .node.client{ left:20px }
  .node.server{ right:20px }

  /* Outage timer (centered) */
  .timer{
    position:fixed; top:90px; left:50%; transform:translateX(-50%);
    padding:10px 14px; border-radius:12px;
    background: rgba(18,26,36,0.95);
    border:1px solid rgba(148,163,184,0.25);
    color:#ffd7d7; font-weight:700; font-variant-numeric: tabular-nums;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
    display:none; z-index:11;
  }
  body.offline .timer{ display:inline-flex }

  .card{
    position:fixed; right:20px; bottom:20px;
    background: linear-gradient(180deg, rgba(15,22,32,0.9), rgba(15,22,32,0.7));
    border:1px solid rgba(148,163,184,0.15); border-radius:16px;
    padding:14px 16px; backdrop-filter: blur(10px);
    color:var(--muted);
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
    z-index:5;
  }
  .legend{ display:flex; gap:12px; align-items:center; }
  .chip{ height:8px; width:24px; border-radius:6px; background:var(--ok) }
  .chip.bad{ background:var(--bad) }

  /* Offline color on status pill only */
  body.offline .pill{ background:var(--bad) }
</style>
</head>
<body>
  <header class="bar">
    <div style="display:flex; align-items:center; gap:12px">
      <div style="width:14px;height:14px;border-radius:999px;background:#37b3ff;box-shadow:0 0 16px rgba(55,179,255,.9)"></div>
      <div>
        <div style="font-weight:700">Client → Server Link</div>
        <div style="font-size:12px; color:var(--muted)">Constant directional flow</div>
      </div>
    </div>
    <div class="target">UCS Multi Cloud Demo</div>
    <div class="status">
      <div class="pill" id="pill"></div>
      <div class="status-text" id="statusText">Connected</div>
    </div>
  </header>

  <aside class="node client">
    <h3>Client</h3>
    <p>Your browser / app</p>
  </aside>
  <aside class="node server">
    <h3>UCS Federation</h3>
    <p>Multi Cloud Environment</p>
  </aside>

  <!-- Outage timer -->
  <div class="timer" id="outageTimer">Outage 0s</div>

  <canvas id="stage" aria-label="Client-to-server flow"></canvas>

  <div class="card">
    <div class="legend">
      <div class="chip"></div><span class="label">Flow healthy</span>
      <div class="chip bad" style="margin-left:10px"></div><span class="label">Flow offline</span>
    </div>
  </div>

<script>
  // ---------- Connectivity monitor ----------
  const TARGET_ORIGIN = 'https://multicloud.rumksc.hu/';
  const CHECK_INTERVAL_MS = 3000;
  const TIMEOUT_MS = 2000;

  async function checkConnectivity() {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort('timeout'), TIMEOUT_MS);
    try {
      await fetch(TARGET_ORIGIN + '/robots.txt', {
        method: 'HEAD',
        cache: 'no-store',
        mode: 'no-cors',
        signal: ctrl.signal
      });
      clearTimeout(t);
      return true;
    } catch (e) {
      clearTimeout(t);
      return false;
    }
  } // [web:9]

  // ---------- Canvas: strict client→server stream (no pulsing) ----------
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  let DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  let W = 0, H = 0;
  function resize() {
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize(); // [web:39]

  function rect(sel){ const r = document.querySelector(sel).getBoundingClientRect(); return {x:r.left,y:r.top,w:r.width,h:r.height}; }
  function canvasY(y){ return y - 64 }

  const PARTICLES = 1000;
  const SEG_LEN = 6;           // constant segment length
  const FADE_RATE = 0.015;     // destination-out fading
  const LINE_ALPHA_ON = 0.38;
  const LINE_ALPHA_OFF = 0.6;
  const WIDTH_ON = 1.0;
  const WIDTH_OFF = 1.3;

  const COLOR_OK = { r:0, g:255, b:153 };
  const COLOR_BAD = { r:255, g:77, b:79 };

  let connected = true;
  let targetColor = { ...COLOR_OK };
  let currentColor = { ...COLOR_OK };

  function lerp(a,b,t){ return a + (b - a) * t }
  function lerpColor(c1,c2,t){ return { r:Math.round(lerp(c1.r,c2.r,t)), g:Math.round(lerp(c1.g,c2.g,t)), b:Math.round(lerp(c1.b,c2.b,t)) } }

  let clientBox = rect('.node.client');
  let serverBox = rect('.node.server');

  // Guidance path: quadratic bezier from a point inside client to a destination inside server.
  function spawn(p){
    const sy = clientBox.y + clientBox.h * (0.25 + Math.random() * 0.5);
    const sx = clientBox.x + clientBox.w - 8;
    const dy = serverBox.y + serverBox.h * (0.25 + Math.random() * 0.5);
    const dx = serverBox.x + 12;

    // Control point roughly midway, with slight vertical variance to form a funnel
    const cx = (sx + dx) * 0.5;
    const cy = (sy + dy) * 0.5 + (Math.random() * 2 - 1) * 40;

    p.t = 0;                   // param along bezier
    p.dt = (connected ? 0.010 : 0.006) * (0.8 + Math.random()*0.4); // constant progression per frame
    p.sx = sx; p.sy = canvasY(sy);
    p.cx = cx; p.cy = canvasY(cy);
    p.dx = dx; p.dy = canvasY(dy);
    p.x = p.sx; p.y = p.sy;
  } // [web:31]

  function bezier(p, t){
    const u = 1 - t;
    const x = u*u*p.sx + 2*u*t*p.cx + t*t*p.dx;
    const y = u*u*p.sy + 2*u*t*p.cy + t*t*p.dy;
    return {x,y};
  } // [web:39]

  const particles = new Array(PARTICLES).fill(0).map(() => ({
    t:0, dt:0.01,
    sx:0,sy:0,cx:0,cy:0,dx:0,dy:0,
    x:0,y:0
  }));
  particles.forEach(spawn);

  // Timer elements
  const statusText = document.getElementById('statusText');
  const outageEl = document.getElementById('outageTimer');
  let outageStart = null;
  let timerHandle = null;

  function startTimer(){
    if (timerHandle) return;
    outageStart = performance.now(); // monotonic timer
    outageEl.textContent = 'Outage 0s';
    timerHandle = setInterval(() => {
      const secs = Math.floor((performance.now() - outageStart)/1000);
      outageEl.textContent = `Outage ${secs}s`;
    }, 200);
  } // [web:78][web:75]

  function stopTimer(){
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
    outageStart = null;
    outageEl.textContent = '';
  } // [web:75]

  // Render loop (no additive blend, no opacity modulation)
  let last = performance.now();
  function tick(now){
    last = now;

    clientBox = rect('.node.client');
    serverBox = rect('.node.server');

    // Fade trails with destination-out for stable brightness
    ctx.globalCompositeOperation = 'destination-out';
    ctx.globalAlpha = FADE_RATE;
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over'; // [web:39][web:59]

    currentColor = lerpColor(currentColor, targetColor, 0.08);

    const c = currentColor;
    ctx.strokeStyle = `rgba(${c.r}, ${c.g}, ${c.b}, ${connected ? LINE_ALPHA_ON : LINE_ALPHA_OFF})`;
    ctx.lineWidth = connected ? WIDTH_ON : WIDTH_OFF;
    ctx.lineCap = 'round';

    for (let i=0;i<particles.length;i++){
      const p = particles[i];
      const prevx = p.x, prevy = p.y;

      p.t += p.dt; // constant step → constant flow, no pulsing
      if (p.t >= 1){
        spawn(p); // immediately start a new path to server
      }
      const pos = bezier(p, p.t);
      p.x = pos.x; p.y = pos.y;

      ctx.beginPath();
      ctx.moveTo(prevx, prevy);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function setConnected(ok){
    if (ok === connected) return;
    connected = ok;
    if (ok){
      document.body.classList.remove('offline');
      statusText.textContent = 'Connected';
      targetColor = { ...COLOR_OK };
      stopTimer();
      // speed up new paths when back online
      particles.forEach(p => { p.dt = 0.010 * (0.8 + Math.random()*0.4); });
    } else {
      document.body.classList.add('offline');
      statusText.textContent = 'Disconnected';
      targetColor = { ...COLOR_BAD };
      startTimer();
      // slow down progression while offline (still constant, just slower and red)
      particles.forEach(p => { p.dt = 0.006 * (0.8 + Math.random()*0.4); });
    }
  }

  // Initial assumption: connected
  setConnected(true);

  // Connectivity polling with simple debounce (2 identical samples)
  let lastResult = null, sameCount = 0;
  async function poll(){
    const ok = await checkConnectivity(); // HEAD no-cors reachability
    if (ok === lastResult) {
      sameCount++;
    } else {
      sameCount = 0;
      lastResult = ok;
    }
    if (sameCount >= 1) setConnected(ok);
  }
  poll();
  setInterval(poll, CHECK_INTERVAL_MS); // [web:9]
</script>
</body>
</html>
